<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Login</title>
</head>
<body>
    
    <div class="page-wrapper">
        <h1>Log in to your account</h1>

        <div class="auth-container">
            <form id="login-form">
                <div class="form-group">
                    <label for="email-el">Email address</label>
                    <input type="email" id="email-el" name="email" class="form-input" placeholder="j.doe@aui.ma" required>
                </div>

                <div class="form-group">
                    <label for="password-el">Password</label>
                    <input type="password" id="password-el" name="password" class="form-input" required>

                </div>

                <div class="form-options">
                    <label>
                        <input type="checkbox" checked="checked" id="rememberme-checkbox">
                        Remember me 
                    </label>
                </div>
           

            <button type="submit" id="login-btn">Log In</button>
        </form>
        <p>Don't have an account? <a href="register.html">Sign up</a></p>
    </div>

    </div>
    
    
</body>
</html>
